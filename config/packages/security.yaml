security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        App\Entity\User: 'auto'  # ⚠️ Changé : Spécifiez votre entité User

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            # ⚠️ Supprimez 'form_login' et gardez uniquement 'custom_authenticator'
            custom_authenticator: App\Security\LoginFormAuthenticator
            logout:
                path: app_logout
                target: app_home  # Redirection après déconnexion
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2419200  # 4 semaines
                path: /
                always_remember_me: true

    # Access Control
    access_control:
        - { path: ^/admin, roles: ROLE_USER }  # ⚠️ Changé : ROLE_ADMIN pour admin
        - { path: ^/profile, roles: ROLE_USER }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/logout, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10